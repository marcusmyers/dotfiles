onboarding = false
# Keep the tmux muscle memory while using Herdr's workspace and agent model.

[theme]
name = "solarized"

auto_switch = false
[terminal]
default_shell = "nu"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
zoom = "prefix+plus"
switch_tab = "prefix+1..9"

[ui]
mouse_capture = true
pane_borders = true
pane_gaps = true
confirm_close = true

show_agent_labels_on_pane_borders = true
[remote]
manage_ssh_config = true

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false
